<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Players Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fafafa;
    }
    h1 {
      text-align: center;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .error {
      color: red;
      font-weight: bold;
      text-align: center;
    }
    .download-button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Players Data</h1>
  <div id="error" class="error"></div>
  <button id="download-button" class="download-button">Download CSV</button>
  <table id="players-table">
    <thead>
      <tr>
        <th>Player Name</th>
        <th>Creation Timestamp</th>
      </tr>
    </thead>
    <tbody>
      <!-- Player rows will be inserted here -->
    </tbody>
  </table>

  <script>
    // Update this with your actual API endpoint URL
    const apiUrl = 'https://littleninja.games.cg.jku.at/players';
    let playersData = [];

    // Fetch player data and populate the table
    async function fetchPlayers() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) {
          throw new Error(`Network response was not ok: ${response.statusText}`);
        }
        const data = await response.json();
        // Assuming the API returns { players: [...] }
        playersData = data.players;
        displayPlayers(playersData);
      } catch (err) {
        document.getElementById('error').textContent = 'Error fetching players: ' + err.message;
        console.error('Error:', err);
      }
    }

    // Create table rows based on the player data
    function displayPlayers(players) {
      const tbody = document.querySelector('#players-table tbody');
      tbody.innerHTML = ''; // Clear any existing rows

      players.forEach(player => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${player.player_name}</td>
          <td>${player.creation_timestamp}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Convert JSON array to CSV format
    function convertToCSV(objArray) {
      const array = typeof objArray !== 'object' ? JSON.parse(objArray) : objArray;
      let csv = '';
      if (array.length > 0) {
        // Create the header row using the keys of the first object
        const headers = Object.keys(array[0]).join(',');
        csv += headers + '\r\n';
      }
      // Process each row
      array.forEach(item => {
        const row = Object.values(item)
          .map(value => `"${value}"`)
          .join(',');
        csv += row + '\r\n';
      });
      return csv;
    }

    // Download CSV file
    function downloadCSVFile() {
      if (playersData.length === 0) {
        alert('No data available to download.');
        return;
      }
      const csv = convertToCSV(playersData);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      if (link.download !== undefined) {
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "players.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    // Add event listener for download button
    document.getElementById('download-button').addEventListener('click', downloadCSVFile);

    // Fetch data once the page loads
    window.onload = fetchPlayers;
  </script>
</body>
</html>
